name: Build Silvane Kiosk ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Prerequisites & Flutter SDK
        run: |
          apt-get update && apt-get install -y curl git unzip xz-utils jq
          curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.5-stable.tar.xz | tar -xJ -C /opt/
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Execute Complete Kiosk Build Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          chmod +x ./build_kiosk.sh
          ./build_kiosk.sh